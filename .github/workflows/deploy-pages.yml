name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and test
        run: |
          pnpm check
          pnpm test

      - name: Build site
        # The map uses Leaflet + OpenStreetMap tiles, so no API keys are needed.
        run: pnpm exec vite build --base="/${{ github.event.repository.name }}/"

      - name: Prerender per-route pages, sitemap and robots.txt
        run: node scripts/prerender-routes.mjs dist/public "https://${{ github.repository_owner }}.github.io" "/${{ github.event.repository.name }}/"

      - name: Drop dev-only files from the site
        run: rm -rf dist/public/__manus__

      - name: Add SPA fallback for client-side routes
        run: cp dist/public/index.html dist/public/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
